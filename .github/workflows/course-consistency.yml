name: Course consistency
on:
  push:
    paths:
      - "SYLLABUS.*"
      - "lessons/**"
      - "curriculum/**"
      - "taskwarrior/**"
      - "scripts/check_course.py"
      - ".github/workflows/course-consistency.yml"
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m py_compile taskwarrior/import_course.py scripts/check_course.py
      - run: python3 scripts/check_course.py

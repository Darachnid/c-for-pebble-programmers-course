[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c-for-pebble-assessor"
version = "0.2.0"
description = "Post-submit evidence assessor for the C for Pebble Programmers course (local Ollama)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
assess = "assessor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ollama: tests that call Ollama (mocked or live)",
]

[dependency-groups]
dev = ["pytest>=7.0"]

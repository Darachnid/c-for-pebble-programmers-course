[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c-for-pebble-assessor"
version = "0.1.0"
description = "Post-submit evidence assessor for the C for Pebble Programmers course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "spacy>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
assess = "assessor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "spacy: tests that require en_core_web_md",
]

[dependency-groups]
dev = ["pytest>=7.0"]
model = [
  "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

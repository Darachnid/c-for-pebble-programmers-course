# Terminal course driver — 41-activity wizard: graded pilot 1A–5A, tailored learner review 6A–41A.
version: 1
sequence:
  - 1A
  - 2A
  - 3A
  - 4A
  - 5A

activities:
  1A:
    title: Explore Pebble examples
    depends: []
    lesson_readme: lessons/01A/README.md
    pebble_workdir: lessons/01A/clock
    pebble_notes: "Also inspect lessons/01A/fonts and lessons/01A/storage (separate projects)."
    assessor_rubric: rubrics/1A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "What you saw in the clock, fonts, or storage examples."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Compare the feasibility or limitations of your ideas; a runtime boundary test is not required."
      - key: explain
        section: "## Explain in your own words"
        prompt: >
          Five distinct ideas (each: change + API), one marked most interesting;
          mention example, variation, and feasibility in your own words.

  2A:
    title: Build and run a time-only C watchface
    depends: []
    lesson_readme: lessons/02A/README.md
    pebble_workdir: lessons/02A/starter
    assessor_rubric: rubrics/2A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "Time display, minute updates, single TextLayer, no date layer."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Normal read + boundary (e.g. minute rollover)."
      - key: explain
        section: "## Explain in your own words"
        prompt: "Brief workflow explanation (build, emulator, time-only checkpoint)."

  3A:
    title: Variables, Data Types, and Operators
    depends: [2A]
    lesson_readme: lessons/03A/README.md
    pebble_workdir: lessons/03A/projects/project-3-1
    pebble_notes: "Repeat build/run for lessons/03A/projects/project-3-2."
    assessor_rubric: rubrics/3A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "Behavior of project-3-1 and project-3-2 on the emulator."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "At least one boundary case per project."
      - key: explain
        section: "## Explain in your own words"
        prompt: "C feature you applied and what changed in each project."

  4A:
    title: Find and document a Pebble API function
    depends: [3A]
    lesson_readme: lessons/04A/README.md
    pebble_workdir: lessons/04A/starter
    assessor_rubric: rubrics/4A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "Optional — starter behavior if you ran the build."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Describe a documented API constraint or usage limitation. No runtime boundary test is required."
      - key: explain
        section: "## Explain in your own words"
        prompt: "API note — purpose, signature, args, return type, usage example."

  5A:
    title: Change one visual property of a time-only watchface
    depends: [3A, 4A, 2A]
    lesson_readme: lessons/05A/README.md
    pebble_workdir: lessons/05A/starter
    assessor_rubric: rubrics/5A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "One visual change; time still updates; no date TextLayer."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Normal glance + one edge case you tested."
      - key: explain
        section: "## Explain in your own words"
        prompt: "Which visual property you changed and why (glanceability)."

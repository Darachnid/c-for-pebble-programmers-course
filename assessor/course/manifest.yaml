# Terminal course driver — 41-activity wizard: graded pilot 1A–5A, tailored learner review 6A–41A.
version: 1
sequence:
  - 1A
  - 2A
  - 3A
  - 4A
  - 5A

activities:
  1A:
    title: Explore Pebble examples
    depends: []
    lesson_readme: lessons/01A/README.md
    pebble_workdir: lessons/01A/clock
    pebble_notes: "Also inspect lessons/01A/fonts and lessons/01A/storage (separate projects)."
    assessor_rubric: rubrics/1A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "Clock, font, and storage examples: Identify which provided examples you inspected and the behavior or SDK API each suggests."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Feasibility comparison: Compare feasibility, user value, and technical uncertainties of your alternatives. No executable boundary case is needed."
      - key: explain
        section: "## Explain in your own words"
        prompt: "Five ideas and choice: Describe five distinct variations, name the relevant API for each, and identify the most interesting idea to investigate."

  2A:
    title: Build and run a time-only C watchface
    depends: []
    lesson_readme: lessons/02A/README.md
    pebble_workdir: lessons/02A/starter
    assessor_rubric: rubrics/2A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "Time-only watchface: Report one TextLayer, the time display, and the successful build and Emery/Gabbro emulator observations."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Minute rollover: Record an observed minute tick or rollover; explain whether the time updated as expected."
      - key: explain
        section: "## Explain in your own words"
        prompt: "Build workflow: Explain project structure, build/install steps, and why the date TextLayer is absent."

  3A:
    title: Variables, Data Types, and Operators
    depends: [2A]
    lesson_readme: lessons/03A/README.md
    pebble_workdir: lessons/03A/projects/project-3-1
    pebble_notes: "Repeat build/run for lessons/03A/projects/project-3-2."
    assessor_rubric: rubrics/3A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "Two C projects: Describe the observed output of project-3-1 and project-3-2 and the variable/operator changes you made."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Project edge cases: Record relevant boundary or unusual inputs for both projects and what happened."
      - key: explain
        section: "## Explain in your own words"
        prompt: "C concepts applied: Explain the types, expressions, and operations used and link each to its result."

  4A:
    title: Find and document a Pebble API function
    depends: [3A]
    lesson_readme: lessons/04A/README.md
    pebble_workdir: lessons/04A/starter
    assessor_rubric: rubrics/4A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "API source and example: Provide the SDK documentation URL and show where the selected function is used. Running an emulator is optional."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "API constraints: Describe parameter limitations, preconditions, or other documented constraints; no runtime boundary test is required."
      - key: explain
        section: "## Explain in your own words"
        prompt: "Function reference note: Record the function's purpose, full signature, parameters, return type, and one usage example in your own words."

  5A:
    title: Change one visual property of a time-only watchface
    depends: [3A, 4A, 2A]
    lesson_readme: lessons/05A/README.md
    pebble_workdir: lessons/05A/starter
    assessor_rubric: rubrics/5A.yaml
    user_fields:
      - key: behavior
        section: "## Behavior observed"
        prompt: "Single visual change: Identify the one changed visual property, what you observed on the watchface, and confirmation that time updates and no date layer was added."
      - key: boundary
        section: "## Boundary case tested"
        prompt: "Glanceability check: Report legibility and an appropriate display or time-update edge case."
      - key: explain
        section: "## Explain in your own words"
        prompt: "UI rationale: Explain why that font, color, alignment, position, or background change improves or changes glanceability."

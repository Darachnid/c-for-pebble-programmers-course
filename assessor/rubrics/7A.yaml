# Authoritative completion text: lessons/7A/README.md (Completion evidence)
id: 7A
lesson_readme: lessons/7A/README.md
paths:
  - lessons/7A/**
evidence_template: templates/EVIDENCE.md.tpl
evidence_sections:
  - "## Artifact paths"
  - "## Build and run"
  - "## Behavior observed"
  - "## Boundary case tested"
  - "## Explain in your own words"
  - "## Source diff"
spacy:
  meets_min_margin: 0.05
  uncertain_band: 0.02
  exemplar_dirs:
    meets: examples/7A/meets
    below: examples/7A/below
criteria:
  - id: build_and_run
    text: The project builds and runs on the Emery emulator
    source: lesson
    deterministic:
      - kind: require_build_log_or_evidence
        log_pattern: "(?i)(build|waf|success|app_bundle)"
        evidence_pattern: "(?i)pebble build|build.*success|install.*emery"
      - kind: regex_in_evidence
        pattern: "(?i)emery"
    spacy:
      required_phrases:
        - build
        - emulator
        - emery

  - id: time_only_face
    text: Displays current time, updates by minute, with no date TextLayer
    source: lesson
    deterministic:
      - kind: regex_in_evidence
        pattern: "(?i)textlayer|time"
      - kind: forbid_regex_in_evidence
        pattern: "(?i)added a date|second textlayer for the date|date textlayer for"
      - kind: max_textlayer_create_in_diff
        max: 1
    spacy:
      required_phrases:
        - TextLayer
        - minute

  - id: workflow_artifacts
    text: Tangible artifact under lesson paths and honest evidence of your work
    source: syllabus
    deterministic:
      - kind: require_paths_changed
        min_files: 1
      - kind: require_section
        section: "## Explain in your own words"
      - kind: regex_in_evidence
        pattern: "(?i)boundary"
    spacy:
      required_phrases:
        - boundary
